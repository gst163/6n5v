name: Update 6n5v Host

on:
  schedule:
    # 每 6 小时跑一次（UTC 时间，对应北京时间 0:00, 6:00, 12:00, 18:00）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============ 网络测试（诊断用，网络通了就可以删掉）============
      - name: Test network
        run: |
          echo "=== 测试 k34h ==="
          curl -v -m 10 http://k34h.com/enter/index.html || echo "k34h 挂了"
          echo ""
          echo "=== 测试 ccca ==="
          curl -v -m 10 "http://ccca.jxbyte.com:8080/?u=aHR0cDovL2szNGguY29t&p=L2VudGVyL2luZGV4Lmh0bWw=" || echo "ccca 挂了"
          echo ""
          echo "=== 测试 gist（对照组）==="
          curl -v -m 10 https://api.github.com || echo "github api 挂了"

      - name: Install deps
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run fetch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python fetch_host.py
